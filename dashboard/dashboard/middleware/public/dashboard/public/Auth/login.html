<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeX · تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #0a0a0c; --bg-1: #111114; --bg-2: #18181d; --bg-3: #202028;
      --border: rgba(255,255,255,.07); --border-hi: rgba(255,255,255,.14);
      --red: #e8363c; --red-dim: rgba(232,54,60,.15); --red-glow: rgba(232,54,60,.3);
      --text-0: #f0f0f5; --text-1: #9191a4; --text-2: #5a5a70;
      --font: 'IBM Plex Sans Arabic', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg-0);
      color: var(--text-0);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      width: 360px;
      box-shadow: 0 0 60px rgba(232,54,60,.08);
    }
    .logo {
      width: 64px; height: 64px;
      background: var(--red-dim);
      border: 1px solid var(--red-glow);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p  { color: var(--text-1); font-size: 13px; margin-bottom: 32px; line-height: 1.6; }
    .btn-discord {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #5865F2;
      color: #fff;
      border: none; border-radius: 10px;
      padding: 14px 24px;
      font-size: 14px; font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      width: 100%;
      transition: background .18s ease, transform .12s ease;
      text-decoration: none;
    }
    .btn-discord:hover { background: #4752c4; transform: translateY(-1px); }
    .btn-discord svg { flex-shrink: 0; }
    .btn-discord img {
  filter: brightness(0) invert(1);
}
    .note { margin-top: 20px; font-size: 11px; color: var(--text-2); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="https://i.imgur.com/vDuXJqM.png" width="70px" alt="logo">
    </div>
    <h1>CodeX Dashboard</h1>
    <p>سجّل دخولك عبر Discord للوصول إلى لوحة التحكم</p>
    <a href="/auth/login" class="btn-discord">
      <img src="https://i.imgur.com/sniE5xW.png" width="28px" alt="Discord">
      تسجيل الدخول بـ Discord
    </a>
    <div class="note">الدخول متاح للأونر والمضافين في الـ Whitelist فقط</div>
  </div>
</body>
</html>
