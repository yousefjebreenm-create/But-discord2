<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>CodeX · Access Denied</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-0:#0a0a0c; --bg-1:#111114; --border:rgba(255,255,255,.07); --red:#e8363c; --red-dim:rgba(232,54,60,.15); --red-glow:rgba(232,54,60,.3); --text-0:#f0f0f5; --text-1:#9191a4; --text-2:#5a5a70; --font:'IBM Plex Sans Arabic',sans-serif; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font); background:var(--bg-0); color:var(--text-0); height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:var(--bg-1); border:1px solid var(--border); border-radius:16px; padding:48px 40px; text-align:center; width:360px; }
    .icon { font-size:48px; margin-bottom:20px; }
    h1 { font-size:20px; font-weight:700; margin-bottom:8px; color:var(--red); }
    p  { color:var(--text-1); font-size:13px; margin-bottom:28px; line-height:1.6; }
    a  { display:inline-block; background:var(--red-dim); border:1px solid var(--red-glow); color:var(--red); padding:10px 24px; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none; transition:.18s; }
    a:hover { background:rgba(232,54,60,.25); }
  </style>
</head>
<body>
  <div class="card">
    
    <div class="icon">
      <img src="icons/Untitled-22.png" width="28px" alt="">
    </div>

    <h3>ليس لديك صلاحيه كافيه</h3>
    <br>
    <a href="/auth/logout">تسجيل الخروج</a>

  </div>
</body>
</html>
